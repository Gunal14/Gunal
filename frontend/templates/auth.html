<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Safety Monitoring System - Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8FBFD;
            --bg-panel: #FAFBFC;
            --bg-tertiary: #F0F5F9;
            --border: #E0E7F1;
            --border-light: #EDF1F7;
            --accent-primary: #00BFFF;
            --accent-secondary: #17A2B8;
            --accent-ai: #00BFFF;
            --danger: #FF3B30;
            --warning: #00BFFF;
            --success: #34C759;
            --neutral: #8A8A8E;
            --text-primary: #000000;
            --text-secondary: #556B7F;
            --text-muted: #7EA8C4;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-left: 5px solid var(--accent-primary);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(30, 144, 255, 0.2);
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, var(--cyber-accent-primary), var(--cyber-accent-secondary));
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: none;
        }

        .auth-header p {
            font-size: 14px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-tabs {
            display: flex;
            background: var(--cyber-bg-main);
            border-bottom: 2px solid var(--cyber-border);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: var(--cyber-text-secondary);
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Orbitron', monospace;
        }

        .tab-btn:hover {
            background: rgba(0, 212, 255, 0.05);
            color: var(--cyber-accent-primary);
        }

        .tab-btn.active {
            background: rgba(0, 212, 255, 0.1);
            color: var(--cyber-accent-primary);
            border-bottom-color: var(--cyber-accent-primary);
        }

        .auth-form-container {
            padding: 30px 25px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: #1f1f1f;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .auth-header {
            background: linear-gradient(135deg, #222222 0%, #333333 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .auth-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .auth-tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: #1b1b1b;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #b0b0b0;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-btn:hover {
            background: #efefef;
        }

        .tab-btn.active {
            background: white;
            color: var(--cyber-text-main);
            border-bottom-color: var(--cyber-text-secondary);
        }

        .auth-form-container {
            padding: 30px 25px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cyber-text-secondary);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
        }

        .strength-meter {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .strength-bar {
            height: 100%;
            background: #666;
            width: 0%;
            transition: all 0.3s ease;
        }

        .strength-bar.weak {
            background: #777;
            width: 25%;
        }

        .strength-bar.fair {
            background: #ffa500;
            width: 50%;
        }

        .strength-bar.good {
            background: #4ecdc4;
            width: 75%;
        }

        .strength-bar.strong {
            background: #51cf66;
            width: 100%;
        }

        .strength-text {
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #444444 0%, #555555 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.2);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            color: #666;
            font-weight: 400;
            font-size: 13px;
            flex: 1;
        }

        .checkbox-group a {
            color: var(--cyber-text-main);
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .form-footer {
            text-align: center;
            margin-top: 15px;
            color: #b0b0b0;
            font-size: 14px;
        }

        .form-footer a {
            color: var(--cyber-text-main);
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #cccccc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            text-align: center;
            padding: 30px 20px;
        }

        .success-icon {
            font-size: 50px;
            color: #51cf66;
            margin-bottom: 15px;
        }

        .success-message h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .success-message p {
            color: #666;
            margin-bottom: 20px;
        }

        @media (max-width: 500px) {
            .auth-container {
                max-width: 100%;
            }

            .auth-header h1 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>🔐 Safety Monitoring</h1>
            <p>AI-Powered Safety System</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <div class="auth-form-container">
            <!-- Login Form -->
            <div class="form-section active" id="login">
                <div id="login-alert" class="alert"></div>
                
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" name="username" required 
                               placeholder="Enter your username">
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required
                               placeholder="Enter your password">
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="remember-me" name="remember">
                        <label for="remember-me">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Login</button>
                </form>

                <div class="form-footer">
                    Don't have an account? <a onclick="switchTab('register'); return false;" href="#register">Register here</a>
                </div>
            </div>

            <!-- Registration Form -->
            <div class="form-section" id="register">
                <div id="register-alert" class="alert"></div>

                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="first_name"
                                   placeholder="First name">
                        </div>
                        <div class="form-group">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" name="last_name"
                                   placeholder="Last name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" name="username" required
                               placeholder="Choose a username (min 3 chars)">
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" name="email" required
                               placeholder="your.email@example.com">
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" name="password" required
                               placeholder="Min 8 chars, uppercase, lowercase, digit, special char"
                               onchange="checkPasswordStrength(this.value)">
                        <div class="password-strength">
                            <div class="strength-meter">
                                <div class="strength-bar" id="strength-bar"></div>
                            </div>
                            <div class="strength-text" id="strength-text">Password strength: —</div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm_password" required
                               placeholder="Re-enter your password">
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="agree-terms" name="agree" required>
                        <label for="agree-terms">I agree to the <a href="#terms" target="_blank">Terms of Service</a></label>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Account</button>
                </form>

                <div class="form-footer">
                    Already have an account? <a onclick="switchTab('login'); return false;" href="#login">Login here</a>
                </div>
            </div>

            <!-- Success Message -->
            <div class="form-section" id="success" style="text-align: center;">
                <div class="success-message">
                    <div class="success-icon">✓</div>
                    <h2 id="success-title">Success!</h2>
                    <p id="success-message">Your account has been created. You can now login.</p>
                    <button class="btn btn-primary" onclick="switchTab('login')">Go to Login</button>
                </div>
            </div>

            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing...</p>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.form-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            // Clear alerts
            document.getElementById('login-alert').classList.remove('show');
            document.getElementById('register-alert').classList.remove('show');
        }

        // Password strength checker
        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');

            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;

            strengthBar.className = 'strength-bar';
            switch (strength) {
                case 0:
                case 1:
                    strengthBar.classList.add('weak');
                    strengthText.textContent = 'Password strength: Weak';
                    break;
                case 2:
                case 3:
                    strengthBar.classList.add('fair');
                    strengthText.textContent = 'Password strength: Fair';
                    break;
                case 4:
                    strengthBar.classList.add('good');
                    strengthText.textContent = 'Password strength: Good';
                    break;
                case 5:
                    strengthBar.classList.add('strong');
                    strengthText.textContent = 'Password strength: Strong ✓';
                    break;
            }
        }

        // Show alert
        function showAlert(alertId, message, type) {
            const alert = document.getElementById(alertId);
            alert.className = `alert show alert-${type}`;
            alert.textContent = message;
        }

        // Show loading
        function showLoading(show = true) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        // Login handler
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                showAlert('login-alert', 'Please fill in all fields', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Store tokens
                    localStorage.setItem('access_token', data.tokens.access_token);
                    localStorage.setItem('refresh_token', data.tokens.refresh_token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Remember me
                    if (document.getElementById('remember-me').checked) {
                        localStorage.setItem('remember_me', 'true');
                    }

                    showAlert('login-alert', 'Login successful! Redirecting...', 'success');
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showAlert('login-alert', data.error || 'Login failed', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('login-alert', 'Network error. Please try again.', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Register handler
        async function handleRegister(event) {
            event.preventDefault();

            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const firstName = document.getElementById('first-name').value;
            const lastName = document.getElementById('last-name').value;

            if (!username || !email || !password) {
                showAlert('register-alert', 'Please fill in all required fields', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('register-alert', 'Passwords do not match', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password,
                        confirm_password: confirmPassword,
                        first_name: firstName,
                        last_name: lastName
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Show success message
                    document.getElementById('success-title').textContent = 'Account Created Successfully!';
                    document.getElementById('success-message').textContent = 
                        'Your account has been created. Please login with your credentials.';
                    
                    document.querySelectorAll('.form-section').forEach(section => {
                        section.classList.remove('active');
                    });
                    document.querySelectorAll('.tab-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    document.getElementById('success').classList.add('active');

                    // Clear form
                    document.getElementById('register-form').reset();
                } else {
                    showAlert('register-alert', data.error || 'Registration failed', 'error');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('register-alert', 'Network error. Please try again.', 'error');
            } finally {
                showLoading(false);
            }
        }

        // Load stored credentials if remember me was checked
        window.addEventListener('load', () => {
            if (localStorage.getItem('remember_me')) {
                const username = localStorage.getItem('remember_username');
                if (username) {
                    document.getElementById('login-username').value = username;
                    document.getElementById('remember-me').checked = true;
                }
            }
        });

        // Save username when remember me is checked
        document.getElementById('login-form')?.addEventListener('submit', (e) => {
            if (document.getElementById('remember-me').checked) {
                localStorage.setItem('remember_username', document.getElementById('login-username').value);
            }
        });
    </script>
</body>
</html>
