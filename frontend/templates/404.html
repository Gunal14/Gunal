<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found | AI Smart Safety Monitoring</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { background: #020b18; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .notfound-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .notfound-card { max-width: 600px; background: rgba(8, 28, 55, .9); border: 1px solid rgba(0, 191, 255, 0.35); border-radius: 16px; box-shadow: 0 0 45px rgba(0, 191, 255, 0.28); padding: 2.5rem; }
        .notfound-card h1 { font-size: 4.5rem; line-height: 1; margin: 0.2rem; color: #00BFFF; }
        .notfound-card h2 { margin: 0.8rem 0 1rem; font-size: 2rem; color: #ffffff; }
        .notfound-card p { color: #a0cce8; margin: 0.8rem 0 1.5rem; }
        .notfound-card a { display: inline-block; background: #00BFFF; color: #00233f; text-decoration: none; padding: 0.7rem 1.4rem; border-radius: 10px; transition: all 0.2s ease; }
        .notfound-card a:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 191, 255, 0.8); }
    </style>
</head>
<body>
    <div class="notfound-container">
        <div class="notfound-card">
            <h1>404</h1>
            <h2>Resource not found</h2>
            <p>We couldn't find the page you are looking for. The requested resource may have moved or is unavailable.</p>
            <a href="/">Return Home</a>
        </div>
    </div>
</body>
</html>
